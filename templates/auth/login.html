{% extends "base.html" %}

{% block title %}Sign In — ReTurn Platform{% endblock %}

{% block content %}
<div class="py-12 sm:py-16">
    <div class="max-w-md mx-auto px-4 sm:px-6">
        <div class="bg-white p-8 rounded-lg border border-slate-200 shadow-sm">
            <div class="mb-6 text-center">
                <span class="w-10 h-10 rounded bg-slate-900 text-white inline-flex items-center justify-center font-bold text-sm mb-3">RT</span>
                <h2 class="text-2xl font-bold text-slate-900">User Sign In</h2>
                <p class="text-xs text-slate-500 mt-1">Access your personalized re-entry roadmap and profile.</p>
            </div>

            <form method="POST" action="{{ url_for('auth_login') }}" class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com"
                        class="w-full px-3 py-2 text-sm border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="password" class="block text-xs font-semibold text-slate-700">Password</label>
                        <a href="{{ url_for('auth_forgot_password') }}" class="text-xs text-teal-700 hover:underline">Forgot password?</a>
                    </div>
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        class="w-full px-3 py-2 text-sm border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900">
                </div>

                <button type="submit" class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm rounded shadow-sm transition">
                    Sign In
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-200 text-center text-xs text-slate-600 space-y-2">
                <div>
                    Don't have an account? <a href="{{ url_for('auth_register') }}" class="font-semibold text-teal-700 hover:underline">Create an Account</a>
                </div>
                <div>
                    Hiring or posting jobs? <a href="{{ url_for('recruiter_login') }}" class="text-slate-500 hover:text-slate-800 underline">Recruiter Portal</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
