{% extends "base.html" %}

{% block title %}Reset Password — ReTurn Platform{% endblock %}

{% block content %}
<div class="py-12 sm:py-16">
    <div class="max-w-md mx-auto px-4 sm:px-6">
        <div class="bg-white p-8 rounded-lg border border-slate-200 shadow-sm">
            <div class="mb-6 text-center">
                <h2 class="text-2xl font-bold text-slate-900">Forgot Password</h2>
                <p class="text-xs text-slate-500 mt-1">Enter your registered email address to receive password reset instructions.</p>
            </div>

            <form method="POST" action="{{ url_for('auth_forgot_password') }}" class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com"
                        class="w-full px-3 py-2 text-sm border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900">
                </div>

                <button type="submit" class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm rounded shadow-sm transition">
                    Send Password Reset Link
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-slate-200 text-center text-xs text-slate-600">
                Remember your password? <a href="{{ url_for('auth_login') }}" class="font-semibold text-teal-700 hover:underline">Back to Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
